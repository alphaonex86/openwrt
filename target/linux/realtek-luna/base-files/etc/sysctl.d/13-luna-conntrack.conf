# Every Luna stock rc script sets these: at 120 s TIME_WAIT a LAN closing 30 connections a second fills the
# 3072-entry table, and an abandoned flow held 7440 s ESTABLISHED does the same (operator: stock's 600 s).
net.netfilter.nf_conntrack_tcp_timeout_time_wait=60
net.netfilter.nf_conntrack_tcp_timeout_established=600
